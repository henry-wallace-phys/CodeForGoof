[project]
name = "codeforgoof"
version = "1.0.1"
description = "Code to help Zoe"
readme = "README.md"
authors = [
    { name = "henry-wallace-phys", email = "henry.wallace.phys@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "ipython",
    "jupyter",
    "pyinstaller>=6.17.0",
    "pyqt5>=5.15.11",
    "pytest",
    "pytest-qt>=4.5.0",
    "ruff>=0.14.10",
    "tqdm",
]

[project.scripts]
rename_files_cli = "codeforgoof.apps.__main__rename_file__:main"
rename_files = "codeforgoof.apps.__main__pyqt_rename:main"

[tool.ruff]
target-version = "py310"
line-length = 100

select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
]

ignore = [
    "E501",  # long lines (handled by formatter/editor)
]

exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
