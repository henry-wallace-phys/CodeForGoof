---
name: Build GUI binaries (Windows / macOS / Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: rename_files-windows.exe
            pyinstaller_args: >
              --onefile
              --windowed
              --name rename_files-windows
              -m codeforgoof.apps.__main__tkinter_rename

          - os: macos-latest
            artifact_name: rename_files-macos
            pyinstaller_args: >
              --onefile
              --windowed
              --name rename_files-macos
              -m codeforgoof.apps.__main__tkinter_rename

          - os: ubuntu-latest
            artifact_name: rename_files-linux
            pyinstaller_args: >
              --onefile
              --windowed
              --name rename_files-linux
              -m codeforgoof.apps.__main__tkinter_rename

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build binary
        run: |
          pyinstaller ${{ matrix.pyinstaller_args }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
