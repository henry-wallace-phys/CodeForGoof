name: Build GUI binaries (Windows / macOS / Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: rename_files-windows.exe
            artifact_path: dist/rename_files-windows.exe
            build_mode: --onefile
          - os: macos-latest
            artifact_name: rename_files-macos.app
            artifact_path: dist/rename_files.app
            build_mode: --onedir
          - os: ubuntu-latest
            artifact_name: rename_files-linux
            artifact_path: dist/rename_files-linux
            build_mode: --onefile

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build binary
        shell: bash
        run: |
          pyinstaller \
            ${{ matrix.build_mode }} \
            --windowed \
            --name ${{ matrix.os == 'macos-latest' && 'rename_files' || matrix.artifact_name }} \
            src/codeforgoof/apps/__main__pyqt_rename.py

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}